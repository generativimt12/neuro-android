name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Unzip project files
      run: |
        unzip -o neuro-android.zip
        echo "=== Root Directory Contents ==="
        ls -la
        if [ -d "neuro-android" ]; then
          echo "=== neuro-android Directory Contents ==="
          ls -la neuro-android
        fi

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Build Debug APK
      run: |
        if [ -f "neuro-android/build.gradle.kts" ]; then
          cd neuro-android && gradle assembleDebug
        elif [ -f "build.gradle.kts" ]; then
          gradle assembleDebug
        else
          echo "Error: build.gradle.kts not found!"
          exit 1
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: "**/app/build/outputs/apk/debug/app-debug.apk"
